<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fondo con bordes redondeados -->
  <rect x="25" y="25" width="450" height="450" rx="80" ry="80" fill="#2E3375" stroke="#484C8A" stroke-width="4" />

  <g transform="translate(0, -10)">
    <!-- Pin Azul Oscuro (Borde/Fondo) -->
    <path d="M 250,110 
             C 140,110 120,220 250,390 
             C 380,220 360,110 250,110 Z" 
          fill="#1D6FE5" />

    <!-- Pin Azul Claro (Interior) -->
    <path d="M 250,132 
             C 162,132 145,220 250,365 
             C 355,220 338,132 250,132 Z" 
          fill="#33C2FF" />

    <!-- Pez en el centro -->
    <g transform="translate(250, 240)">
      <!-- Cola del pez -->
      <!-- Aleta posterior (Azul oscuro) -->
      <path d="M 12,0 C 35,-25 60,-15 52,0 C 60,15 35,25 12,0 Z" fill="#1D6FE5" />
      <!-- Aleta interior (Azul claro/medio) -->
      <path d="M 12,0 C 30,-16 48,-10 42,0 C 48,10 30,16 12,0 Z" fill="#4B8BF5" />

      <!-- Cuerpo blanco ovalado -->
      <ellipse cx="-25" cy="0" rx="42" ry="30" fill="#FFFFFF" />

      <!-- Ojo -->
      <circle cx="-42" cy="-7" r="4.5" fill="#0B132B" />

      <!-- Sonrisa -->
      <path d="M -26,0 Q -21,8 -17,2" stroke="#0B132B" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>
  </g>
</svg>
